<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>REMNANT</title>
<style>
:root{--bg:#eef6ff;--card:#fff;--tx:#1f2a44;--mu:#6b7a99;--ac:#3b82f6;--bd:#d6e6fb;--ch:#f97316;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16213a;--card:#1f2d4d;--tx:#eef3ff;--mu:#9fb0d3;--ac:#60a5fa;--bd:#2d4170;--ch:#fdba74;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16213a;--card:#1f2d4d;--tx:#eef3ff;--mu:#9fb0d3;--ac:#60a5fa;--bd:#2d4170;--ch:#fdba74;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px;color:var(--ac)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
button,select,input,textarea{font:inherit;color:var(--tx)}
.tab,.b{border:1px solid var(--bd);background:var(--card);padding:8px 14px;border-radius:10px;cursor:pointer}
.tab.on,.b.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.b.s{padding:4px 10px;font-size:13px}
.card{box-shadow:0 2px 8px rgba(59,130,246,.08);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.card .t{flex:1;min-width:0;cursor:pointer}.card b{display:block}.mu{color:var(--mu);font-size:13px}
input,textarea,select{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
textarea{min-height:240px;font-family:ui-monospace,Menlo,monospace;font-size:14px}
.row{display:flex;gap:8px;margin:8px 0;align-items:center;flex-wrap:wrap}
.sheet{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:10px 0;overflow-x:auto}
.ln{display:flex;flex-wrap:wrap;align-items:flex-end;min-height:2.6em}
.sg{display:inline-flex;flex-direction:column;white-space:pre}
.c{color:var(--ch);font-weight:700;font-size:13px;min-height:1.3em;padding-right:6px}
.cl{color:var(--ch);font-weight:700;font-family:ui-monospace,Menlo,monospace;white-space:pre}
.sec{color:var(--mu);font-size:12px;margin-top:10px}
.back{background:none;border:0;color:var(--ac);cursor:pointer;padding:0 0 8px;font-size:14px}
.hide{display:none}
.card{flex-wrap:wrap}
body.s-songs{--ac:#6d5ce8;--bg:#f4f0ff;--bd:#e0d8fa}
body.s-word{--ac:#3b82f6;--bg:#eef5ff;--bd:#d6e6fb}
body.s-pray{--ac:#14a37f;--bg:#ecf9f4;--bd:#cfeee2}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) body.s-songs{--ac:#a592ff;--bg:#1e1a3a;--card:#2a2548;--bd:#3d3668}:root:not([data-theme="light"]) body.s-word{--ac:#60a5fa;--bg:#16213a;--card:#1f2d4d;--bd:#2d4170}:root:not([data-theme="light"]) body.s-pray{--ac:#3dd6a8;--bg:#143028;--card:#1d3d34;--bd:#2a5446}}
body.home{background:linear-gradient(135deg,#e6f3ff,#fffaf4 50%,#ffeee3);min-height:100vh}body.home .w{max-width:980px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) body.home{background:linear-gradient(135deg,#1b2d4a,#1a2236 50%,#3a2a2c)}}
:root[data-theme="dark"] body.home{background:linear-gradient(135deg,#1b2d4a,#1a2236 50%,#3a2a2c)}
.dc{position:fixed;border:1px solid var(--bd);border-radius:50%;pointer-events:none;opacity:.7}
.hero{position:relative;text-align:center;padding:40px 0 30px}.logo{width:84px;height:84px;margin:0 auto 18px;border-radius:24px;background:var(--card);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 6px 20px rgba(99,102,241,.15)}
.ttl{font-size:clamp(34px,8vw,54px);font-weight:800;letter-spacing:2px;line-height:1.2;background:linear-gradient(90deg,#3b7bea,#ee7d4a);-webkit-background-clip:text;background-clip:text;color:transparent;margin:0}
.bar{width:52px;height:3px;border-radius:3px;margin:14px auto;background:linear-gradient(90deg,#3b82f6,#f97316)}.sub{color:var(--mu);font-size:14px;font-weight:600}
.hg{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-top:8px}
.hc{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:28px 24px 24px;min-height:210px;cursor:pointer;box-shadow:0 8px 24px rgba(99,102,241,.08);transition:transform .2s,box-shadow .2s}
.hc:hover{transform:translateY(-4px);box-shadow:0 14px 32px rgba(99,102,241,.16)}
.hc::before{content:"";position:absolute;top:-50px;right:-50px;width:150px;height:150px;border-radius:50%;background:var(--t)}
.hc::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--a);opacity:0;transition:opacity .2s}.hc:hover::after{opacity:.7}
.ic{position:relative;width:60px;height:60px;border-radius:18px;background:var(--t);display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:22px}
.hc h3{position:relative;margin:0 0 6px;font-size:16px;font-weight:800;letter-spacing:0;white-space:nowrap}.hc p{position:relative;margin:0;color:var(--mu);font-size:13px;padding-right:44px}
.go{position:absolute;right:18px;bottom:18px;width:38px;height:38px;border-radius:50%;background:var(--t);color:var(--a);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
</style></head><body><div class="w">
<button class="back" id="hm" style="display:none">← 처음으로</button>
<h1 id="h1"></h1>
<div class="tabs" id="tb"><button class="tab on" data-t="songs">찬양 목록</button><button class="tab" data-t="sets">콘티</button></div>
<div id="v"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===== 여기를 본인 값으로 바꾸세요 (README.md 참고) ===== */
const SUPABASE_URL="https://ofbpuntdkwopwmxvxamq.supabase.co";
const SUPABASE_KEY="sb_publishable_drQXTx8XmEhkIrqYfrPqcw_xUMJeeFk";
/* ======================================================== */
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),T='docs',LS=new Set();
let MY;try{MY=localStorage.getItem('uid');if(!MY){MY='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);localStorage.setItem('uid',MY)}}catch(e){MY='u'+Math.random().toString(36).slice(2,10)}
let _rt;const refresh=()=>{clearTimeout(_rt);_rt=setTimeout(()=>LS.forEach(f=>f()),200)};
const wr=async p=>{const r=await p;if(r.error)throw r.error;await Promise.all([...LS].map(f=>f()));return r};
const claude={async use(n){
 if(n==='db')return{collection:c=>({
  onSnapshot:(f,e)=>{let t;const load=async()=>{const r=await sb.from(T).select('id,data').eq('collection',c);if(r.error){e&&e(r.error);return}f({docs:r.data.map(d=>({id:d.id,data:()=>d.data}))})};LS.add(load);load();
   const ch=sb.channel('rt-'+c+Math.random().toString(36).slice(2,6)).on('postgres_changes',{event:'*',schema:'public',table:T,filter:'collection=eq.'+c},()=>{clearTimeout(t);t=setTimeout(load,250)}).subscribe();
   return()=>{LS.delete(load);sb.removeChannel(ch)}},
  doc:id=>({
   set:d=>wr(sb.from(T).upsert({collection:c,id,data:d})),
   update:async d=>{const g=await sb.from(T).select('data').eq('collection',c).eq('id',id).maybeSingle();if(g.error||!g.data)throw g.error||new Error('not found');return wr(sb.from(T).upsert({collection:c,id,data:{...g.data.data,...d}}))},
   delete:()=>wr(sb.from(T).delete().eq('collection',c).eq('id',id))})})};
 if(n==='user')return{id:async()=>MY,isOwner:()=>true,canEdit:()=>true};
 if(n==='downloads')return{save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}};
 if(n==='assets')return{upload:async b=>{const du=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(b)}),id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);await wr(sb.from(T).upsert({collection:'photos',id,data:{data:du,ts:Date.now()}}));return{id}}};
 return null}};
async function getPhoto(id){const r=await sb.from(T).select('data').eq('collection','photos').eq('id',id).maybeSingle();if(r.data)return r.data.data.data;throw new Error('photo not found')}
function loadPhotos(root){root.querySelectorAll('img[data-ph]').forEach(async im=>{try{const u=await getPhoto(im.dataset.ph);if(u.startsWith('data:application/pdf'))renderPdf(im,u);else im.src=u}catch(e){}})}
</script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SH=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],FL={Db:'C#',Eb:'D#',Gb:'F#',Ab:'G#',Bb:'A#'};
const KEYS=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const idx=k=>{k=FL[k]||k;return SH.indexOf(k)};
const flatKeys=['F','Bb','Eb','Ab','Db','Dm','Gm','Cm','Fm'];
function tr(ch,n,flat){return ch.replace(/[A-G][#b]?/g,m=>{const i=idx(m);if(i<0)return m;const j=(i+n+120)%12;const s=SH[j];return flat&&s.includes('#')?({'C#':'Db','D#':'Eb','F#':'Gb','G#':'Ab','A#':'Bb'})[s]:s})}
const CT=/^[A-G][#b]?(m|maj|min|sus|add|dim|aug|M)?\d*(\/[A-G][#b]?)?$/;
const isChordLine=l=>{const t=l.trim().split(/\s+/);return l.trim()&&t.every(x=>CT.test(x))};
function semis(from,to){return ((idx(to)-idx(from))%12+12)%12}
function render(body,n,flat){
  return body.split('\n').map(l=>{
    if(/^\s*[\(\[]?(Verse|Chorus|Bridge|Intro|Outro|Pre|절|후렴|브릿지|간주|전주|후주)/i.test(l)&&!/\[[A-G]/.test(l))return `<div class="sec">${esc(l)}</div>`;
    if(isChordLine(l))return `<div class="cl">${esc(tr(l,n,flat))}</div>`;
    if(!/\[[^\]]+\]/.test(l))return `<div class="ln"><span class="sg"><span class="c"> </span>${esc(l)||' '}</span></div>`;
    const p=l.split(/\[([^\]]+)\]/);let h='';
    if(p[0])h+=`<span class="sg"><span class="c"> </span>${esc(p[0])}</span>`;
    for(let i=1;i<p.length;i+=2)h+=`<span class="sg"><span class="c">${esc(tr(p[i],n,flat))}</span>${esc(p[i+1]||'')||' '}</span>`;
    return `<div class="ln">${h}</div>`}).join('')}
function toText(body,n,flat){return body.split('\n').map(l=>isChordLine(l)?tr(l,n,flat):l.replace(/\[([^\]]+)\]/g,(m,c)=>'['+tr(c,n,flat)+']')).join('\n')}

let db=null,dl=null,sm=null,ast=null,uid=null,adm=false,own=false,site='home',words=[],wv=null,prs=[],pv=null,pf='all',songs=[],sets=[],tab='songs',view=null,cur={id:null,name:'',items:[]},err='';
const sorted=a=>a.slice().sort((x,y)=>(x.title||'').localeCompare(y.title||'','ko'));
const song=id=>songs.find(s=>s.id===id);
const can=s=>adm||(!!s.by&&s.by===uid);

async function shrink(f,mx=1600){const b=await createImageBitmap(f),r=Math.min(1,mx/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*r;c.height=b.height*r;c.getContext('2d').drawImage(b,0,0,c.width,c.height);return new Promise(ok=>c.toBlob(ok,'image/jpeg',.85))}

async function init(){
  try{db=await claude.use('db');dl=await claude.use('downloads')}catch(e){}
  try{ast=await claude.use('assets')}catch(e){}
  try{const u=await claude.use('user');uid=await u.id();adm=!!(u.isOwner()||u.canEdit());own=!!u.isOwner()}catch(e){}
  if(!db){err='저장소 연결에 실패했어요. index.html 위쪽의 SUPABASE_URL / SUPABASE_KEY 설정을 확인해주세요.';draw();return}
  const t=setTimeout(()=>{},10000);
  db.collection('songs').onSnapshot(s=>{clearTimeout(t);songs=s.docs.map(d=>({id:d.id,...d.data()}));draw()},e=>{err='불러오기 실패: '+e.message;draw()});
  db.collection('prayers').onSnapshot(s=>{prs=s.docs.map(d=>({id:d.id,...d.data()}));draw()},()=>{});
  db.collection('words').onSnapshot(s=>{words=s.docs.map(d=>({id:d.id,...d.data()}));draw()},()=>{});
  db.collection('setlists').onSnapshot(s=>{sets=s.docs.map(d=>({id:d.id,...d.data()}));draw()},()=>{});
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;view=null;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));draw()});

function draw(){
  const v=$('#v');
  $('#h1').textContent={home:'🙌 함께 나눔',songs:'🎵 WORSHIP of REMNANT',word:'📖 MESSAGE of REMNANT',pray:'🙏 PRAISE of REMNANT'}[site];
  document.body.className=site==='home'?'home':'s-'+site;$('#h1').style.display=site==='home'?'none':'';$('#hm').style.display=site==='home'?'none':'';$('#tb').style.display=site==='songs'?'':'none';
  if(site==='home')return home2(v);
  if(site==='songs'&&view&&view.kind==='edit'&&v.querySelector('#ph'))return;
  if(site==='word'&&wv&&v.querySelector('#rf'))return;
  if(site==='pray'&&pv&&v.querySelector('#ty'))return;
  if(err&&!db){v.innerHTML=`<p class="mu">${esc(err)}</p>`;return}
  if(site!=='pray')pv=null;
  if(site==='word')return wordPage(v);
  if(site==='pray')return prayPage(v);
    if(view&&view.kind==='edit')return editor(v);
  if(view&&view.kind==='song')return viewer(v);
  tab==='songs'?list(v):setPage(v)}

function list(v){
  v.innerHTML=`<div class="row"><input id="q" placeholder="제목 검색" style="flex:1"><button class="b p" id="add">+ 악보 올리기</button></div><div id="l"></div>`;
  const paint=()=>{const q=$('#q').value.trim().toLowerCase();const a=sorted(songs).filter(s=>!q||(s.title+' '+(s.artist||'')).toLowerCase().includes(q));
    $('#l').innerHTML=a.length?a.map(s=>`<div class="card"><div class="t" data-o="${s.id}"><b>${esc(s.title)}</b><span class="mu">Key ${esc(s.key||'-')}${s.artist?' · '+esc(s.artist):''}</span></div><button class="b s" data-d="${s.id}">⬇ 다운로드</button>${own?`<button class="b s" data-x2="${s.id}">🗑 삭제</button>`:''}<button class="b s" data-a="${s.id}">+ 콘티</button></div>`).join(''):'<p class="mu">아직 악보가 없어요. 첫 악보를 올려보세요!</p>';
    $('#l').querySelectorAll('[data-o]').forEach(e=>e.onclick=()=>{view={kind:'song',id:e.dataset.o,n:0};draw()});
    $('#l').querySelectorAll('[data-a]').forEach(e=>e.onclick=()=>{const s=song(e.dataset.a);cur.items.push({id:s.id,key:s.key||'C'});e.textContent='✓ 담김';e.disabled=true});
    $('#l').querySelectorAll('[data-d]').forEach(e=>e.onclick=async()=>{const s=song(e.dataset.d),o=e.textContent;e.textContent='준비 중…';e.disabled=true;try{await dlSong(s)}catch(x){e.textContent='실패'}setTimeout(()=>{e.textContent=o;e.disabled=false},1200)});
    $('#l').querySelectorAll('[data-x2]').forEach(e=>e.onclick=async()=>{const s=song(e.dataset.x2);if(own&&s&&sure(e)){try{await db.collection('songs').doc(s.id).delete()}catch(x){e.textContent='삭제 실패'}}})};
  $('#q').oninput=paint;paint();
  $('#add').onclick=()=>{view={kind:'edit',s:{title:'',artist:'',key:'C',body:''}};draw()}}

function viewer(v){
  const s=song(view.id);if(!s){view=null;return draw()}
  const base=s.key||'C',to=KEYS[(idx(base)+view.n+120)%12]||base,flat=flatKeys.includes(to);
  v.innerHTML=`<button class="back" id="bk">← 목록</button><h2 style="margin:0">${esc(s.title)}</h2><div class="mu">${esc(s.artist||'')}</div>
  <div class="row"><span>키</span><select id="k" style="width:auto">${KEYS.map(k=>`<option ${k===to?'selected':''}>${k}</option>`).join('')}</select><span class="mu">원키 ${esc(base)}</span><span style="flex:1"></span>${can(s)?'<button class="b s" id="ed">수정</button>':''}<button class="b s" id="dn">텍스트</button><button class="b s" id="im">이미지</button><button class="b s" id="pf">PDF</button></div>
  ${(s.imgs||[]).length?`<div class="row"><button class="b s ${view.ph!==false?'p':''}" id="tp">📷 원본 사진</button><button class="b s ${view.ph===false?'p':''}" id="tc">🎼 코드 악보</button></div>`:''}<div class="sheet">${(s.imgs||[]).length&&view.ph!==false?s.imgs.map(i=>`<img data-ph="${i}" style="width:100%;border-radius:8px;display:block;margin-bottom:8px">`).join(''):render(s.body||'',semis(base,to),flat)}</div>`;
  $('#bk').onclick=()=>{view=null;draw()};
  $('#k').onchange=e=>{view.n=semis(base,e.target.value);draw()};
  loadPhotos(v);$('#im').onclick=()=>imgOf([{s,key:to}],s.title);if($('#tp')){$('#tp').onclick=()=>{view.ph=true;draw()};$('#tc').onclick=()=>{view.ph=false;draw()}}$('#pf').onclick=()=>pdfOf([{s,key:to}],s.title);
  if($('#ed'))$('#ed').onclick=()=>{view={kind:'edit',s};draw()};
  $('#dn').onclick=()=>save(`${s.title}.txt`,`${s.title} (Key ${to})\n\n${toText(s.body||'',semis(base,to),flat)}`)}

function editor(v){
  if(!view.d)view.d={...view.s,imgs:[...(view.s.imgs||[])]};const s=view.d,imgs=s.imgs;
  v.innerHTML=`<button class="back" id="bk">← 취소</button><h2 style="margin:0 0 8px">${s.id?'악보 수정':'악보 올리기'}</h2>
  <div class="row"><label class="b p" style="cursor:pointer">📷 악보 사진·PDF 첨부<input id="ph" type="file" accept="image/jpeg,image/webp,image/gif,application/pdf" multiple hidden></label><span class="mu" id="am">${imgs.length?'📎 파일 '+imgs.length+'개 첨부됨':'악보 사진(JPG)이나 PDF를 첨부하면 곡을 열 때 원본이 보여요'}</span></div>
  <div class="row"><input id="ti" placeholder="제목" value="${esc(s.title)}"></div>
  <div class="row"><input id="ar" placeholder="아티스트(선택)" value="${esc(s.artist||'')}" style="flex:1"><select id="ky" style="width:90px">${KEYS.map(k=>`<option ${k===s.key?'selected':''}>${k}</option>`).join('')}</select></div>
  <textarea id="bo" placeholder="가사 사이에 코드를 [G]처럼 넣어주세요&#10;&#10;[Verse]&#10;[G]주님의 [D]사랑은 [Em]끝이 없[C]네&#10;&#10;또는 코드만 있는 줄을 가사 위에 써도 돼요:&#10;G    D   Em&#10;주님의 사랑은">${esc(s.body||'')}</textarea>
  <div class="row"><button class="b p" id="sv">저장하고 공유</button>${s.id&&own?'<button class="b" id="del">삭제</button>':''}<span class="mu" id="m"></span></div>
  <p class="mu">미리보기</p><div class="sheet" id="pv"></div>`;
  const pv=()=>{$('#pv').innerHTML=render($('#bo').value,0,false)};pv();$('#bo').oninput=()=>{s.body=$('#bo').value;pv()};$('#ti').oninput=e=>{s.title=e.target.value};$('#ar').oninput=e=>{s.artist=e.target.value};$('#ky').onchange=e=>{s.key=e.target.value};
  $('#ph').onchange=async e=>{const fs=[...e.target.files].slice(0,6);if(!fs.length)return;const m=$('#am');
    if(!ast){m.textContent='사진을 저장할 수 없어요';return}

const PW=1240,PH=1754,MX=90;
function layout(items,hdr){
  const F='"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif',pages=[];let cv,g,y;
  const np=()=>{cv=document.createElement('canvas');cv.width=PW;cv.height=PH;g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,PW,PH);if(hdr){g.fillStyle='#999';g.font=`22px ${F}`;g.textAlign='right';g.fillText(hdr,PW-MX,56);g.textAlign='left'}y=120;pages.push(cv)};
  const room=h=>{if(y+h>PH-80)np()};
  const isSec=l=>/^\s*[\(\[]?(Verse|Chorus|Bridge|Intro|Outro|Pre|절|후렴|브릿지|간주|전주|후주)/i.test(l)&&!/\[[A-G]/.test(l);
  np();

async function imgOf(items,name){try{const{pages,lastY}=layout(items,'');const c=document.createElement('canvas');c.width=PW;c.height=PH*(pages.length-1)+Math.min(PH,lastY+60);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);pages.forEach((p,i)=>g.drawImage(p,0,i*PH));await save(name+'.png',await new Promise(r=>c.toBlob(r,'image/png')))}catch(e){alert('이미지 만들기 실패: '+(e.message||e))}}

async function mkPdf(bl){
  const enc=new TextEncoder(),parts=[],off=[];let len=0;
  const add=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length};
  const obj=(n,fn)=>{off[n]=len;add(`${n} 0 obj\n`);fn();add('\nendobj\n')};
  const N=bl.length;add('%PDF-1.4\n');
  obj(1,()=>add('<</Type/Catalog/Pages 2 0 R>>'));
  obj(2,()=>add(`<</Type/Pages/Count ${N}/Kids[${bl.map((_,i)=>`${5+i*3} 0 R`).join(' ')}]>>`));
  for(let i=0;i<N;i++){const b=new Uint8Array(await bl[i].arrayBuffer()),im=3+i*3,ct=4+i*3,c='q 595 0 0 842 0 0 cm /I Do Q';
    obj(im,()=>{add(`<</Type/XObject/Subtype/Image/Width ${PW}/Height ${PH}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${b.length}>>\nstream\n`);add(b);add('\nendstream')});
    obj(ct,()=>add(`<</Length ${c.length}>>\nstream\n${c}\nendstream`));
    obj(5+i*3,()=>add(`<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Contents ${ct} 0 R/Resources<</XObject<</I ${im} 0 R>>>>>>`))}
  const T=3+3*N,xs=len;add(`xref\n0 ${T}\n0000000000 65535 f \n`);for(let n=1;n<T;n++)add(String(off[n]).padStart(10,'0')+' 00000 n \n');
  add(`trailer\n<</Size ${T}/Root 1 0 R>>\nstartxref\n${xs}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'})}

async function dlSong(s){
  const ids=s.imgs||[];
  if(!ids.length)return imgOf([{s,key:s.key||'C'}],s.title);
  const bl=[];for(const id of ids){const u=typeof getPhoto==='function'?await getPhoto(id):'/_blob/'+id;bl.push(await (await fetch(u)).blob())}
  if(bl.length===1)return save(s.title+('.'+(bl[0].type.split('/')[1]||'jpg').replace('jpeg','jpg')),bl[0]);
  if(bl.some(b=>b.type==='application/pdf')){let i=1;for(const b of bl)await save(s.title+'-'+(i++)+'.'+(b.type.split('/')[1]||'jpg').replace('jpeg','jpg'),b);return}
  return save(s.title+'.pdf',await mkPdf2(await Promise.all(bl.map(toJpg))))}
